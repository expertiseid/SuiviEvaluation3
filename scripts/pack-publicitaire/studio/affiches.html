<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Affiches Monitora</title>
<link rel="stylesheet" href="polices.css">
<link rel="stylesheet" href="studio.css">
<style>
  #scene { --u: 10.8px; }
  .entete { display: flex; align-items: center; gap: calc(var(--u) * 2); direction: ltr; }
  .badge { display: inline-block; padding: calc(var(--u) * 1) calc(var(--u) * 2.4); border-radius: 999px; background: var(--safran); color: var(--encre);
    font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: calc(var(--u) * 2.4); }
  .surtitre { color: var(--menthe); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; font-size: calc(var(--u) * 2.6); }
  .titre { font-family: var(--serif); font-weight: 600; line-height: 1.04; letter-spacing: -0.015em; }
  .texte { color: rgba(255,255,255,.82); line-height: 1.4; }
  .pied { position: absolute; left: 6%; right: 6%; bottom: 4.5%; display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 2); }
  .pied .adresse { color: var(--safran); font-size: calc(var(--u) * 3.2); direction: ltr; }
  .carte-f { border-radius: calc(var(--u) * 2.4); padding: calc(var(--u) * 2.6); background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15); }
  .carte-f .icone-rond { width: calc(var(--u) * 8); height: calc(var(--u) * 8); background: rgba(255,255,255,.08); margin-bottom: calc(var(--u) * 1.6); }
  .carte-f b { display: block; font-size: calc(var(--u) * 3.4); margin-bottom: calc(var(--u) * .6); }
  .carte-f span { color: rgba(255,255,255,.75); font-size: calc(var(--u) * 2.6); line-height: 1.35; }
  .capture { position: absolute; overflow: hidden; border-radius: calc(var(--u) * 2); background: #fff; box-shadow: 0 50px 140px rgba(0,0,0,.6), 0 0 0 calc(var(--u) * .6) rgba(255,255,255,.12); }
  .capture img { width: 100%; height: 100%; object-fit: cover; }
  .point-liste { display: flex; align-items: center; gap: calc(var(--u) * 1.6); font-size: calc(var(--u) * 3); font-weight: 600; }
  .point-liste i { display: grid; place-items: center; width: calc(var(--u) * 5); height: calc(var(--u) * 5); border-radius: 50%; background: var(--menthe); flex: none; }
  .point-liste svg { width: 60%; height: 60%; }
  .qr { background: #fff; border-radius: calc(var(--u) * 3); padding: calc(var(--u) * 3); box-shadow: 0 40px 120px rgba(0,0,0,.5); }
  .qr img { display: block; width: 100%; }
</style>
</head>
<body>
<div id="scene"></div>
<script src="icones.js"></script>
<script src="affiches.js"></script>
</body>
</html>
