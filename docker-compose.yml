name: suivi-evaluation-3

services:
  db:
    container_name: suivi-evaluation-3-db
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: suivi-evaluation-3-backend
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8093:8000"

  scheduler:
    container_name: suivi-evaluation-3-scheduler
    build: ./backend
    # Chaque organisation (plateforme multi-organisations), ou l'installation unique.
    command: sh -c "while true; do python manage.py pour_chaque_organisation check_deadlines; python manage.py supprimer_essais_expires; python manage.py surveiller_disque; sleep 3600; done"
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: suivi-evaluation-3-frontend
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file: .env
    depends_on:
      - backend
    ports:
      - "5192:5173"

  # Site vitrine (site-vitrine/) : accueil, documentation, inscription. Modifications visibles au rechargement.
  vitrine:
    container_name: suivi-evaluation-3-vitrine
    # Serveur de fichiers statiques de Python (image du backend, déjà construite) : rien à télécharger.
    image: suivi-evaluation-3-backend
    # Mêmes en-têtes de sécurité qu'en production (scripts/serveur_vitrine.py).
    command: python /serveur_vitrine.py /site
    volumes:
      - ./site-vitrine:/site:ro
      - ./scripts/serveur_vitrine.py:/serveur_vitrine.py:ro
    ports:
      - "5193:80"

volumes:
  pgdata:
    name: suivi-evaluation-3-pgdata
