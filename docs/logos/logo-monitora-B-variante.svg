<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Expertise-ID Monitora">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a68"/>
      <stop offset="1" stop-color="#1f2a4a"/>
    </linearGradient>
  </defs>
  <!-- Pastille marine d'Expertise-ID, anneau bleu -->
  <circle cx="32" cy="32" r="30" fill="url(#fond)"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#1ea7e1" stroke-width="2.6" stroke-dasharray="120 18" stroke-linecap="round" transform="rotate(-30 32 32)"/>
  <!-- Barres de progression -->
  <rect x="16" y="36" width="7.5" height="13" rx="2.2" fill="#d9b8b8"/>
  <rect x="28" y="30" width="7.5" height="19" rx="2.2" fill="#ffffff" opacity="0.9"/>
  <rect x="40" y="24" width="7.5" height="25" rx="2.2" fill="#1ea7e1"/>
  <!-- Courbe en circuit -->
  <polyline points="14,30 25,24 36,19 46,14" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="14" cy="30" r="2.1" fill="#ffffff"/>
  <circle cx="25" cy="24" r="2.1" fill="#ffffff"/>
  <circle cx="36" cy="19" r="2.1" fill="#ffffff"/>
  <circle cx="48" cy="13" r="4.4" fill="#1ea7e1" stroke="#ffffff" stroke-width="2"/>
</svg>
