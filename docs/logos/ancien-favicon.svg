<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Expertise-ID Monitora">
  <!-- Fond blanc et anneau bleu d'Expertise-ID (deux arcs, comme son logo) -->
  <circle cx="32" cy="32" r="30" fill="#ffffff"/>
  <path d="M8.5 22 A26 26 0 0 1 52 11.5" fill="none" stroke="#1ea7e1" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M56 40 A26 26 0 0 1 14 52.5" fill="none" stroke="#1ea7e1" stroke-width="3.6" stroke-linecap="round"/>
  <!-- Barres de progression aux couleurs d'Expertise-ID -->
  <rect x="16" y="35" width="7.5" height="14" rx="2.2" fill="#1f2a4a"/>
  <rect x="28" y="29" width="7.5" height="20" rx="2.2" fill="#b38b8b"/>
  <rect x="40" y="23" width="7.5" height="26" rx="2.2" fill="#1ea7e1"/>
  <!-- Courbe des résultats en circuit : nœuds ronds, cible atteinte -->
  <polyline points="14,29 25,23 36,18 46,14" fill="none" stroke="#1f2a4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="14" cy="29" r="2.1" fill="#1f2a4a"/>
  <circle cx="25" cy="23" r="2.1" fill="#1f2a4a"/>
  <circle cx="36" cy="18" r="2.1" fill="#1f2a4a"/>
  <circle cx="48" cy="13" r="4.4" fill="#1ea7e1" stroke="#ffffff" stroke-width="2"/>
</svg>
